# Física 1r Batx · configuració Netlify
# El front és estàtic (carpeta web/). El xat corre com a Netlify Function.

[build]
  publish = "web"
  command = "echo 'sense build: HTML estàtic'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[edge_functions]]
  path = "/*"
  function = "gate"
